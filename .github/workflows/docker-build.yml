name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'devel/**'
      - 'dev/**'
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
  USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      TAGS: ${{ steps.docker_tags.outputs.TAGS }}
      KEEL_TAG: ${{ steps.docker_tags.outputs.KEEL_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(make version | grep -oP 'Version: \K.*')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Determine Docker Tags
        id: docker_tags
        run: |
          TAGS=""
          KEEL_TAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # For version tags (v*), push both the version and latest
            TAG_VERSION=${GITHUB_REF#refs/tags/}
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG_VERSION},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            KEEL_TAG="${TAG_VERSION}"
            echo "Building release: $TAG_VERSION"
          else
            # For branches (main, release/*, devel/*, dev/*), push as devel
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel"
            KEEL_TAG="devel"
            echo "Building development version"
          fi
          echo "TAGS=$TAGS" >> $GITHUB_OUTPUT
          echo "KEEL_TAG=$KEEL_TAG" >> $GITHUB_OUTPUT
          echo "Docker tags: $TAGS"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ env.TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds natively on a runner of the target architecture, so no QEMU
      # emulation is involved. Each leg pushes by digest only; the merge job
      # assembles them into a single tagged multi-arch manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.VERSION }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ env.TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAG_ARGS=""
          for tag in $(echo "${{ needs.prepare.outputs.TAGS }}" | tr ',' ' '); do
            TAG_ARGS="$TAG_ARGS -t $tag"
          done
          docker buildx imagetools create $TAG_ARGS \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          for tag in $(echo "${{ needs.prepare.outputs.TAGS }}" | tr ',' ' '); do
            docker buildx imagetools inspect "$tag"
          done

      - name: Notify Keel
        uses: fjogeleit/http-request-action@master
        with:
          url: 'https://keel.skybyte.me/v1/webhooks/native'
          method: 'POST'
          contentType: 'application/json'
          data: '{"name": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}", "tag": "${{ needs.prepare.outputs.KEEL_TAG }}"}'
